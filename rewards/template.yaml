# =============================================================================
#  template.yaml  -  build your own reward from scratch
# =============================================================================
#  HOW TO USE (no coding needed):
#    1. Copy this file, e.g. to  rewards/mine.yaml
#    2. For each reward you want, change   enabled: false   to   enabled: true
#       and put a number in   weight:   (bigger number = the car cares more).
#    3. Train:   python train.py --reward rewards/mine.yaml --name mine
#
#  Everything starts OFF. Only what you switch on counts - nothing else
#  sneaks in. Training prints the list of switched-on rewards when it starts,
#  so you can double-check.
#
#  [+] = a bonus (adds to the reward)    [-] = a penalty (subtracts)
#  Always write positive numbers; the +/- is fixed for each reward.
#
#  Layout rules: keep the spacing exactly as it is (spaces, not tabs).
#  Lines starting with # are notes and are ignored.
#
#  Scale tip: the car drives about 1 metre every step. With progress at 0.1,
#  a typical trip across town is worth about 30 points. Pick other numbers
#  relative to that, e.g. a crash penalty of 50 = "as bad as losing 500 m".
#  The "suggested" numbers are what the balanced preset (rewards.yaml) uses.
# =============================================================================
name: my_reward
description: Built from scratch.

terms:
  # [+] Points for every metre driven along the GPS route.
  #     Without this the car has no reason to go anywhere.   suggested: 0.1
  progress:
    enabled: false
    weight: 0

  # [+] One-off bonus for parking in the target slot.        suggested: 30
  goal_reached:
    enabled: false
    weight: 0

  # [+] Extra one-off bonus for parking neatly (centred and straight).
  #                                                          suggested: 15
  parking_precision:
    enabled: false
    weight: 0

  # [-] Crashing into a car, parked car or building. Ends the trip.
  #                                                          suggested: 50
  collision:
    enabled: false
    weight: 0

  # [-] Hitting a pedestrian. Ends the trip.                 suggested: 100
  pedestrian_hit:
    enabled: false
    weight: 0

  # [-] Driving fast close to a pedestrian (every step it happens).
  #     Teaches "slow down near people".                     suggested: 0.1
  pedestrian_proximity:
    enabled: false
    weight: 0

  # [-] Driving over a crosswalk while someone is walking on it.
  #                                                          suggested: 10
  crosswalk_yield:
    enabled: false
    weight: 0

  # [-] Going over the speed limit (every step, more for bigger excess).
  #                                                          suggested: 0.05
  speeding:
    enabled: false
    weight: 0

  # [-] Running a red light.                                 suggested: 20
  red_light:
    enabled: false
    weight: 0

  # [-] Not stopping at a stop sign.                         suggested: 10
  stop_sign:
    enabled: false
    weight: 0

  # [-] Drifting away from the middle of the lane / the planned path (every step).
  #                                                          suggested: 0.03
  lane_deviation:
    enabled: false
    weight: 0

  # [-] Wheels on the sidewalk or grass (every step).        suggested: 0.2
  off_road:
    enabled: false
    weight: 0

  # [-] Jerky driving: sudden braking/accelerating, fast steering.
  #     Too big and the car becomes timid.                   suggested: 0.01
  comfort:
    enabled: false
    weight: 0

  # [-] Standing still for no reason (no red light, stop sign, car or
  #     pedestrian in front). Stops the car from just parking on the road.
  #                                                          suggested: 0.03
  stall:
    enabled: false
    weight: 0

  # [-] A small cost for every step, so the car doesn't dawdle.
  #                                                          suggested: 0.005
  time:
    enabled: false
    weight: 0

  # [-] Wandering more than 6 m away from the route. Ends the trip.
  #                                                          suggested: 20
  off_route:
    enabled: false
    weight: 0

  # [-] Standing still for 12 seconds for no reason. Ends the trip.
  #     Stops the car from "freezing" whenever it gets into trouble.
  #                                                          suggested: 20
  stuck:
    enabled: false
    weight: 0

  # [+] Points for raw speed, no matter where the car goes.
  #     WARNING: a classic trap - the car may learn to drive in fast circles.
  #     Fun to try on purpose and watch the cheat detector catch it.
  #                                                          suggested: off
  speed_bonus:
    enabled: false
    weight: 0

# Optional fine-tuning. You can delete this whole section; defaults are used.
settings:
  speed_tolerance_kmh: 3.0      # how far over the limit before it counts as speeding
  lane_deadband_m: 0.4          # lane drift smaller than this is not punished
  ped_proximity_radius_m: 4.0   # how close (m) to a pedestrian before it counts
  stall_speed_ms: 0.5           # slower than this (m/s) counts as standing still
  off_route_distance_m: 6.0     # how far (m) off the route before the trip ends
  stuck_seconds: 12.0           # standing still this long (no reason) = stuck
  terminate_on_red_light: false # true = running a red light ends the trip
  terminate_on_stop_sign: false # true = rolling a stop sign ends the trip
