# =============================================================================
#  cautious.yaml  -  preset: "cautious"
# =============================================================================
#  Every term below has:
#     enabled: true/false   -> switch the term on or off
#     weight:  any number   -> THE POINTS GIVEN when it happens
#                              (positive = gain points, negative = lose points)
#
#  Event terms give their points once (e.g. collision: -50 when it crashes).
#  Step terms give points x an amount every step (e.g. progress: 0.1 per metre).
#  [+]/[-] tags show how each term is USUALLY used; nothing is flipped for you.
#  You can also add your own rules under "custom:" (see REWARD_GUIDE.md).
#
#  Scale intuition: the agent drives ~1 metre per step (0.1 s at 36 km/h), so
#  with progress weight 0.1 a typical 300 m route is worth ~30 points.
#  A one-off -50 therefore "costs" as much as 500 m of driving.
#
#  Try:  python train.py --reward rewards.yaml --name my_experiment
#  Read REWARD_GUIDE.md for what each term does and how to tune it.
#  CAUTIOUS: every safety term is 2-4x the balanced weight, the speed
#  tolerance is 0, the time cost is off. Expect a slower, more hesitant car.
#  Risk: too much fear -> it may learn to creep or stop (watch "stall").
# =============================================================================
format: 3          # weights are signed points (see the header)
name: cautious
description: Safety first - huge penalties for rules and pedestrians, happy to drive slower.

terms:
  # [+] Reward per metre driven ALONG THE GPS ROUTE. The main "go" signal.
  #     Too low -> the car is happy to sit still. Too high -> it ignores rules.
  progress:
    enabled: true
    weight: 0.1

  # [+] One-off bonus for ending the episode parked in the target slot.
  goal_reached:
    enabled: true
    weight: 30.0

  # [+] Extra bonus on success, scaled by how centred/straight the car is
  #     (perfect = full weight, at the tolerance limit = 0).
  parking_precision:
    enabled: true
    weight: 15.0

  # [-] Hitting a car, a parked car or a building. Ends the episode.
  collision:
    enabled: true
    weight: -100.0

  # [-] Hitting a pedestrian. Ends the episode. Should be the worst thing.
  pedestrian_hit:
    enabled: true
    weight: -300.0

  # [-] Per step: being close to a pedestrian (within ped_proximity_radius_m)
  #     WHILE moving. 0 when stopped, max when touching and >= 11 km/h.
  #     This is what teaches "slow down near people" before an accident.
  pedestrian_proximity:
    enabled: true
    weight: -0.4

  # [-] One-off: driving over a crosswalk while a pedestrian is on it.
  crosswalk_yield:
    enabled: true
    weight: -30.0

  # [-] Per step: km/h above the speed limit (+ speed_tolerance_kmh).
  #     At weight -0.0139, 10 km/h over costs 0.14 per step,
  #     which outweighs the extra progress gained (~0.03 per step).
  speeding:
    enabled: true
    weight: -0.0556

  # [-] One-off: front bumper crosses the stop line while the light is red.
  red_light:
    enabled: true
    weight: -50.0

  # [-] One-off: passing a stop sign without coming (almost) to a stop.
  stop_sign:
    enabled: true
    weight: -30.0

  # [-] Per step: metres away from the lane centre beyond lane_deadband_m.
  #     Also punishes drifting into the oncoming lane. In the parking lot it
  #     measures the distance from the planned path into the slot.
  lane_deviation:
    enabled: true
    weight: -0.06

  # [-] Per step: fraction of the car's corners on the sidewalk / grass.
  off_road:
    enabled: true
    weight: -0.5

  # [-] Per step: jerk (change of acceleration) + steering speed.
  #     Small weight = smoother ride. Large weight = timid, sluggish driving.
  comfort:
    enabled: true
    weight: -0.03

  # [-] Per step: standing still (< stall_speed_ms) WITHOUT a reason
  #     (no red light, stop sign, car or pedestrian ahead). Anti-laziness.
  stall:
    enabled: true
    weight: -0.02

  # [-] Per step: a flat cost of existing. Encourages finishing sooner.
  time:
    enabled: true
    weight: 0

  # [-] One-off: wandering more than off_route_distance_m away from the route.
  #     Ends the episode.
  off_route:
    enabled: true
    weight: -20.0

  # [-] One-off: standing still for stuck_seconds with no reason (no red
  #     light, stop sign, car or pedestrian ahead). Ends the episode.
  #     Without this, "freeze when in trouble" is a cheap way out of mistakes.
  stuck:
    enabled: true
    weight: -20.0

  # [+] Per step: raw speed in km/h, no matter where you go.
  #     DANGER: this is a classic reward-hacking bait (drive in circles fast).
  #     Leave it off unless you want to see an exploit.
  speed_bonus:
    enabled: false
    weight: 0.0056

settings:
  speed_tolerance_kmh: 0.0      # how far over the limit before "speeding" counts
  lane_deadband_m: 0.4          # lane_deviation ignores offsets smaller than this
  ped_proximity_radius_m: 6.0   # pedestrian_proximity starts at this distance
  stall_speed_ms: 0.5           # below this speed you count as "standing still"
  off_route_distance_m: 6.0     # leaving the route by more than this ends the episode
  stuck_seconds: 12.0           # idle this long without a reason = stuck (episode ends)
  terminate_on_red_light: false # true = running a red light ends the episode
  terminate_on_stop_sign: false # true = rolling a stop sign ends the episode
