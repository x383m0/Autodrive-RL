# Builds the double-click game (no Python needed) for Windows, macOS and Linux.
# Runs on every push that touches the game, or by hand (Actions tab -> "Build game" -> Run).
# Download the zips from the run's "Artifacts" section. Publishing a GitHub
# Release (or pushing a tag like v1.0) also attaches them to that release.
name: Build game

on:
  workflow_dispatch:
  release:
    types: [published]        # publishing a release on GitHub builds and attaches the zips
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["autodrive/**", "assets/**", "*.py", "rewards/**", "rewards.yaml",
            "requirements.txt", "packaging/**", ".github/workflows/build-game.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: AutodriveGame-Windows
          - os: macos-latest
            name: AutodriveGame-macOS
          - os: ubuntu-latest
            name: AutodriveGame-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch keeps the download small)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then pip install torch; else pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller packaging/autodrive_game.spec --noconfirm
      - name: Self-test the packaged game (starts it, trains 20 s, runs test drives)
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then dist/AutodriveGame/AutodriveGame.exe --selftest; else dist/AutodriveGame/AutodriveGame --selftest; fi
      - name: Zip
        shell: bash
        run: |
          cp packaging/HOW_TO_PLAY.txt dist/AutodriveGame/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../${{ matrix.name }}.zip AutodriveGame; else zip -qr ../${{ matrix.name }}.zip AutodriveGame; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 30
      - name: Attach to the release (tags / published releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
